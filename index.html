<!doctype html>
<!--
  Finance data flows — a zoomable map of BibleProject's finance systems and the processes
  that move data between them. Built as a bp-vibes app: see CLAUDE.md for platform rules.

  Data lives in three `shared` collections declared in vibes.json (anyone signed in at
  BibleProject can read and edit):
    systems — one record per piece of software   { name, category, description, owner, url, x, y }
    flows   — one record per connection, refs.from / refs.to point at systems/<key>
              { kind: flow|reconcile|sync, name, description, frequency, owner, steps: [...] }
    meta    — the "seeded" marker, so the starter map is only written once

  Opened with no platform around it (straight off disk), the app runs in local preview mode
  and keeps everything in this browser's localStorage instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance data flows</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F4EF;
    --grid: #D9D4C7;
    --panel: #FFFFFF;
    --panel-2: #FBFAF7;
    --ink: #22262B;
    --ink-soft: #5B5F66;
    --ink-faint: #8A8E95;
    --line: #E2DED4;
    --line-strong: #C9C4B7;
    --accent: #223047;
    --accent-ink: #FFFFFF;
    --focus: #3569B0;
    --teal: #0F6E56;   --teal-bg: #E1F5EE;
    --amber: #854F0B;  --amber-bg: #FAEEDA;
    --muted-bg: #EFEDE6;
    --danger: #A32D2D; --danger-bg: #F8E9E9;
    --edge: #9AA1AC;
    --edge-flow: #3569B0;
    --edge-rec: #C0632A;
    --edge-sync: #12876A;
    --shadow-sm: 0 1px 2px rgba(34,38,43,.06), 0 2px 8px rgba(34,38,43,.05);
    --shadow: 0 2px 4px rgba(34,38,43,.06), 0 12px 32px rgba(34,38,43,.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171B;
      --grid: #2B2F36;
      --panel: #1E2127;
      --panel-2: #24282F;
      --ink: #E9E7E2;
      --ink-soft: #A7ABB2;
      --ink-faint: #767B83;
      --line: #32373F;
      --line-strong: #464C56;
      --accent: #E9E7E2;
      --accent-ink: #15171B;
      --focus: #7FA8E0;
      --teal: #5DCAA5;   --teal-bg: #133A30;
      --amber: #E9B872;  --amber-bg: #3A2B14;
      --muted-bg: #2A2E35;
      --danger: #F09595; --danger-bg: #3A1F1F;
      --edge: #5F6773;
      --edge-flow: #7FA8E0;
      --edge-rec: #E39A62;
      --edge-sync: #5DCAA5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
      --shadow: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--font);
    display: flex; flex-direction: column;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
  .save-state { font-size: 12px; color: var(--ink-faint); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .save-state .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
  .save-state.saving .dot { background: var(--amber); animation: blink 1s infinite; }
  .save-state.error { color: var(--danger); }
  .save-state.error .dot { background: var(--danger); }
  .save-state.local .dot { background: var(--ink-faint); }
  .save-state button { border: 0; background: none; color: inherit; text-decoration: underline; padding: 0; font-size: 12px; }
  @keyframes blink { 50% { opacity: .3; } }

  .search { position: relative; flex: 1; max-width: 360px; margin-left: auto; }
  .search input {
    width: 100%; padding: 7px 12px 7px 32px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); outline: none;
  }
  .search input:focus { border-color: var(--focus); background: var(--panel); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
  .search kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: 11px var(--font); color: var(--ink-faint);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
  }
  .search input:focus ~ kbd { display: none; }
  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px; max-height: 360px; overflow: auto;
  }
  .results button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: 6px; background: none; text-align: left;
  }
  .results button:hover, .results button.active { background: var(--panel-2); }
  .results .r-sub { color: var(--ink-faint); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .results .ini { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 700; flex-shrink: 0; }
  .results .r-empty { padding: 10px; color: var(--ink-faint); font-size: 13px; }

  .actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--line-strong); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { opacity: .9; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink-soft);
  }
  .icon-btn:hover { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
  .user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .user img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }

  .menu {
    position: absolute; right: 12px; top: calc(100% - 4px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 4px; min-width: 200px; z-index: 30;
  }
  .menu button {
    display: block; width: 100%; text-align: left; padding: 8px 10px;
    border: 0; background: none; border-radius: 6px; font-size: 13px;
  }
  .menu button:hover { background: var(--panel-2); }
  .menu .m-sub { display: block; font-size: 11.5px; color: var(--ink-faint); }

  .banner {
    padding: 8px 16px; font-size: 13px;
    background: var(--amber-bg); color: var(--amber);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
  }
  .banner.error { background: var(--danger-bg); color: var(--danger); }
  .banner button { margin-left: auto; }

  /* ---------- Canvas ---------- */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  #canvas.panning { cursor: grabbing; }
  #canvas text { font-family: var(--font); }

  .node { cursor: pointer; transition: opacity .25s; outline: none; }
  .node-card {
    fill: var(--panel); stroke: var(--line-strong); stroke-width: 1;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.06)) drop-shadow(0 4px 10px rgba(0,0,0,.05));
    transition: stroke .15s;
  }
  .node:hover .node-card, .node:focus-visible .node-card { stroke: var(--ink-faint); }
  .node.sel .node-card { stroke: var(--focus); stroke-width: 2; }
  .node.drop .node-card { stroke: var(--edge-sync); stroke-width: 2.5; }
  .node.dragging { cursor: grabbing; }
  .node-ini { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; letter-spacing: .02em; }
  .node-name { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .node-meta { fill: var(--ink-faint); font-size: 11.5px; }
  .node-handle { fill: var(--panel); stroke: var(--focus); stroke-width: 2; opacity: 0; transition: opacity .15s, r .15s; cursor: crosshair; }
  .node:hover .node-handle, .node.sel .node-handle { opacity: 1; }
  .node-handle:hover { r: 9; fill: var(--focus); }
  #canvas[data-zoom="far"] .node-meta { opacity: 0; }

  .edge { transition: opacity .25s; cursor: pointer; }
  .edge-hit { stroke: transparent; stroke-width: 18; fill: none; }
  .edge-line { fill: none; stroke-width: 2; transition: stroke-width .15s; }
  .k-reconcile .edge-line { stroke-dasharray: 7 6; }
  .m-unset .edge-line { stroke-dasharray: 2 5; }
  .mk-circ { fill: var(--panel); stroke-width: 2; }
  .edge:hover .edge-line, .edge.sel .edge-line { stroke-width: 3; }
  .edge-pulse { fill: none; stroke: var(--panel); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 0.1 46; animation: pulse 1.6s linear infinite; pointer-events: none; }
  @keyframes pulse { to { stroke-dashoffset: -46.1; } }
  .mk-flow { fill: var(--edge-flow); }
  .mk-sync { fill: var(--edge-sync); }
  .mk-rec { fill: var(--panel); stroke: var(--edge-rec); stroke-width: 2; }

  .edge-label { cursor: pointer; transition: opacity .25s; }
  .edge-label .pill { fill: var(--panel); stroke: var(--line-strong); transition: stroke .15s; }
  .edge-label:hover .pill, .edge-label.sel .pill { stroke: var(--focus); }
  .edge-label.sel .pill { stroke-width: 2.6; }
  .edge-label text { font-size: 11.5px; font-weight: 500; fill: var(--ink-soft); }
  .edge-label .pill { stroke-width: 1.3; }
  .edge-label text.edge-name { font-size: 11px; font-weight: 500; fill: var(--ink-faint); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; opacity: 0; transition: opacity .3s; }
  #canvas[data-zoom="near"] .edge-name, .edge-label.sel .edge-name, .edge-label:hover .edge-name { opacity: 1; }
  .method-bar { position: absolute; left: 16px; top: 14px; z-index: 5; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 32px);
    padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); font-size: 12.5px; }
  .mb-lbl { padding: 0 6px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .mb-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border: 1px solid transparent; border-radius: 9px; background: none; color: var(--ink-soft); font-size: 12.5px; }
  .mb-chip:hover { background: var(--panel-2); color: var(--ink); }
  .mb-chip.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, var(--panel)); color: var(--ink); font-weight: 600; }
  .mb-chip.zero { opacity: .55; }
  .mb-chip .lm-count { margin-left: 2px; }
  .stage.drawer-open .method-bar { max-width: calc(100% - 472px); }
  .legend-method { display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 6px; margin: 0 -6px; border: 0; border-radius: 6px; background: none; color: var(--ink-soft); font: inherit; text-align: left; }
  .legend-method:hover { background: var(--panel-2); color: var(--ink); }
  .legend-method.on { background: var(--muted-bg); color: var(--ink); font-weight: 600; }
  .lm-icon { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .lm-count { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-weight: 400; }
  .st-documented { fill: var(--teal); }
  .st-partial { fill: var(--amber); }
  .st-empty { fill: var(--ink-faint); }
  #labels { transition: opacity .25s; }
  #canvas[data-zoom="far"] #labels { opacity: 0; pointer-events: none; }
  .edge-steps { opacity: 0; transition: opacity .3s; pointer-events: none; }
  #canvas[data-zoom="near"] .edge-steps, .edge-label.sel .edge-steps { opacity: 1; pointer-events: auto; }
  .step-dot circle { stroke: var(--panel); stroke-width: 2; }
  .step-dot text { fill: #fff !important; font-size: 10px !important; font-weight: 700 !important; text-anchor: middle; }
  .step-dot:hover circle { stroke: var(--ink); }

  #canvas.has-focus .node:not(.hl),
  #canvas.has-focus .edge:not(.hl),
  #canvas.has-focus .edge-label:not(.hl) { opacity: .18; }

  .ghost { fill: none; stroke: var(--focus); stroke-width: 2; stroke-dasharray: 6 5; pointer-events: none; }

  /* Canvas overlays */
  .zoombar {
    position: absolute; right: 16px; bottom: 16px; z-index: 5;
    display: flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-sm); padding: 3px;
    transition: right .3s cubic-bezier(.2,.8,.2,1);
  }
  .zoombar .icon-btn { width: 30px; height: 30px; }
  .zoombar output { min-width: 44px; text-align: center; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stage.drawer-open .zoombar { right: 456px; }

  .legend {
    position: absolute; left: 16px; bottom: 16px; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-sm); font-size: 12px; max-width: 250px;
  }
  .legend summary { padding: 7px 12px; cursor: pointer; color: var(--ink-soft); font-weight: 500; list-style: none; display: flex; gap: 6px; align-items: center; }
  .legend summary::-webkit-details-marker { display: none; }
  .legend summary::after { content: "▴"; margin-left: auto; font-size: 10px; }
  .legend[open] summary::after { content: "▾"; }
  .legend-body { padding: 2px 12px 10px; display: grid; gap: 10px; }
  .legend h4 { margin: 0 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 600; }
  .legend ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
  .legend li { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow-sm); padding: 6px 8px 6px 14px; font-size: 12px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .stage.drawer-open .hint { display: none; }
  .hint b { color: var(--ink); font-weight: 500; }
  .hint button { border: 0; background: none; color: var(--ink-faint); padding: 2px 6px; border-radius: 999px; }
  .hint button:hover { background: var(--panel-2); color: var(--ink); }

  .empty-state {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4;
  }
  .empty-card {
    pointer-events: auto; text-align: center; max-width: 360px; padding: 28px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .empty-card h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .empty-card p { margin: 0 0 16px; color: var(--ink-soft); font-size: 13.5px; }
  .loading { color: var(--ink-faint); font-size: 13px; }

  /* ---------- Drawer ---------- */
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 440px; z-index: 10;
    background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: var(--shadow);
    transform: translateX(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .dr-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  .dr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft);
  }
  .ghost-select {
    border: 1px solid transparent; background: none; border-radius: 6px; padding: 2px 4px;
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft);
    cursor: pointer;
  }
  .ghost-select:hover, .ghost-select:focus { border-color: var(--line); outline: none; }
  .dr-top .icon-btn { margin-left: auto; }
  .dr-title {
    width: 100%; font-size: 21px; font-weight: 600; letter-spacing: -0.015em;
    border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; margin: 0 -8px 8px;
    background: none; outline: none; width: calc(100% + 16px);
  }
  .dr-title:hover { border-color: var(--line); }
  .dr-title:focus { border-color: var(--focus); background: var(--panel-2); }

  .route { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0 10px; }
  .sys-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px 4px 5px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; font-weight: 500;
  }
  .sys-chip:hover { border-color: var(--line-strong); background: var(--panel); }
  .sys-chip .ini {
    width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
    color: #fff; font-size: 9.5px; font-weight: 700;
  }
  .route-arrow { color: var(--ink-faint); }

  .fld { display: block; margin: 0 0 12px; }
  .fld > span { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-faint); margin-bottom: 4px; }
  .fld input, .fld textarea, .fld select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); outline: none; resize: none; line-height: 1.45;
  }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--focus); background: var(--panel); }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .method-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .method-pick button {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-soft); font-size: 13px; text-align: left;
  }
  .method-pick button svg { color: var(--mc); flex-shrink: 0; }
  .method-pick button:hover { border-color: var(--mc); color: var(--ink); }
  .method-pick button.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, var(--panel)); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--mc); }
  .url-wrap { position: relative; }
  .url-wrap a { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--focus); font-size: 12px; text-decoration: none; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500;
  }
  .badge.documented { background: var(--teal-bg); color: var(--teal); }
  .badge.partial { background: var(--amber-bg); color: var(--amber); }
  .badge.empty { background: var(--muted-bg); color: var(--ink-soft); }

  .sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sec-head h3 { font-size: 13px; font-weight: 600; margin: 0; }
  .sec-head .count { color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
  .sec-head .spacer { flex: 1; }

  .conn-group + .conn-group { margin-top: 12px; }
  .conn-group h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-faint); }
  .conn-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; margin-bottom: 6px; text-align: left;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
    transition: border-color .15s, background .15s;
  }
  .conn-row:hover { border-color: var(--line-strong); background: var(--panel); }
  .conn-row .ini { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .conn-row .c-main { min-width: 0; flex: 1; }
  .conn-row .c-name { font-weight: 500; font-size: 13px; display: block; }
  .conn-row .c-sub { font-size: 12px; color: var(--ink-faint); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .none { font-size: 13px; color: var(--ink-faint); background: var(--panel-2); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 12px; }

  /* Process timeline */
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 15px; top: 20px; bottom: 20px; width: 2px;
    background: repeating-linear-gradient(to bottom, var(--line-strong) 0 5px, transparent 5px 10px);
    animation: flowdown .9s linear infinite;
  }
  @keyframes flowdown { to { background-position: 0 10px; } }
  .tl-end { display: flex; align-items: center; gap: 10px; padding: 4px 0; position: relative; }
  .tl-end .ini {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0;
    color: #fff; font-size: 11px; font-weight: 700; box-shadow: 0 0 0 4px var(--panel); position: relative;
  }
  .tl-end .t-name { font-weight: 600; font-size: 13.5px; }
  .tl-end .t-cap { font-size: 11.5px; color: var(--ink-faint); }
  .tl-step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 6px 0; position: relative; }
  .tl-num {
    width: 26px; height: 26px; margin: 5px 3px 0; border-radius: 50%;
    background: var(--c); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 11.5px; position: relative; box-shadow: 0 0 0 4px var(--panel);
  }
  .tl-step > *, .tl-add > * { min-width: 0; }
  .tl-card {
    min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
    padding: 6px 8px 6px 10px; transition: border-color .15s, box-shadow .3s;
    border-left: 3px solid var(--c);
  }
  .tl-card:focus-within { border-color: var(--focus); border-left-color: var(--c); background: var(--panel); }
  .tl-step.flash .tl-card { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
  .tl-text {
    width: 100%; border: 0; background: none; outline: none; resize: none;
    font-size: 13.5px; line-height: 1.45; padding: 2px 0; display: block; min-height: 22px;
  }
  .tl-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .kind-select {
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
    font-size: 11.5px; padding: 1px 6px; color: var(--c); font-weight: 600; cursor: pointer; outline: none;
  }
  .tool-input {
    flex: 1; min-width: 0; width: 0; border: 1px solid transparent; border-radius: 6px; background: none;
    font-size: 12px; color: var(--ink-soft); padding: 2px 6px; outline: none;
  }
  .tool-input:hover { border-color: var(--line); }
  .tool-input:focus { border-color: var(--focus); background: var(--panel); }
  .tl-ctrl { display: flex; gap: 0; opacity: 0; transition: opacity .15s; }
  .tl-card:hover .tl-ctrl, .tl-card:focus-within .tl-ctrl { opacity: 1; }
  .tl-ctrl button {
    border: 0; background: none; color: var(--ink-faint); width: 24px; height: 22px; border-radius: 5px;
    display: grid; place-items: center; font-size: 12px;
  }
  .tl-ctrl button:hover { background: var(--muted-bg); color: var(--ink); }
  .tl-ctrl button.del:hover { background: var(--danger-bg); color: var(--danger); }
  .tl-ctrl button:disabled { opacity: .3; cursor: default; background: none; }
  .tl-add { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 6px 0; position: relative; }
  .tl-add .plus {
    width: 26px; height: 26px; margin: 3px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px dashed var(--line-strong); background: var(--panel); color: var(--ink-faint); position: relative;
  }
  .tl-add button.add {
    text-align: left; border: 1px dashed var(--line-strong); background: none; border-radius: 10px;
    padding: 6px 10px; color: var(--ink-soft); font-size: 13px;
  }
  .tl-add button.add:hover { border-color: var(--focus); color: var(--focus); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
  .tools .lbl { font-size: 11.5px; color: var(--ink-faint); margin-right: 2px; }
  .tool-chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--muted-bg); color: var(--ink-soft); }

  .dr-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-faint);
  }
  .dr-foot .btn { margin-left: auto; }

  /* ---------- Dialogs & toasts ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 32px));
    background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(20, 22, 26, .35); backdrop-filter: blur(2px); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  dialog .d-sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); }
  dialog .d-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog .d-err { color: var(--danger); font-size: 12.5px; min-height: 1em; margin-top: 4px; }
  .kind-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .kind-pick label {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; text-align: center;
    font-size: 12px; color: var(--ink-soft); display: grid; gap: 4px; justify-items: center;
  }
  .kind-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .kind-pick.method-radio { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kind-pick.method-radio label:has(input:checked) { border-color: var(--mc); box-shadow: 0 0 0 1px var(--mc); }
  .kind-pick label:has(input:checked) { border-color: var(--focus); color: var(--ink); background: var(--panel-2); box-shadow: 0 0 0 1px var(--focus); }

  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13px;
    box-shadow: var(--shadow); animation: toast-in .25s cubic-bezier(.2,.8,.2,1);
  }
  .toast.error { background: var(--danger); color: #fff; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- Hub: tabs & shell ---------- */
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 7px 12px; border-radius: 8px; font-size: 13.5px; color: var(--ink-soft); text-decoration: none; white-space: nowrap; }
  .tabs a:hover { background: var(--panel-2); color: var(--ink); }
  .tabs a.on { background: var(--muted-bg); color: var(--ink); font-weight: 600; }
  body[data-route="hub"] .map-only { display: none !important; }
  body[data-route="hub"] .actions { margin-left: auto; }
  button.user { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px 3px 3px; }
  button.user:hover { border-color: var(--line-strong); }
  .hub-view { position: absolute; inset: 0; z-index: 12; overflow: auto; background: var(--bg); }
  .hub-page { max-width: 1240px; margin: 0 auto; padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 16px; }
  .page-head { display: flex; align-items: center; gap: 12px; }
  .page-head h1 { margin: 0; flex: 1; font-size: 24px; font-weight: 650; letter-spacing: -0.015em; }
  .hub-empty { margin: 60px auto; max-width: 440px; text-align: center; padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .hub-empty h2 { margin: 0 0 8px; font-size: 17px; }
  .hub-empty p { margin: 0 0 16px; color: var(--ink-soft); font-size: 13.5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .muted-sm { display: block; font-size: 12px; color: var(--ink-faint); }
  .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .light { font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--muted-bg); color: var(--ink-soft); white-space: nowrap; }
  .chip.warm { background: var(--amber-bg); color: var(--amber); }
  .chip.dark { background: var(--accent); color: var(--accent-ink); }
  .chip.blue { background: color-mix(in srgb, var(--focus) 16%, var(--panel)); color: var(--focus); }
  .fn-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; margin-right: 6px; vertical-align: middle; }
  .ph { position: relative; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--pc); color: #fff; font-weight: 700; line-height: 1; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph.ring { box-shadow: 0 0 0 3px var(--panel), 0 0 0 4px var(--line-strong); }
  .person-name { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.15; }
  .search-inline { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--ink-faint); min-width: 240px; }
  .search-inline input { border: 0; outline: none; background: none; flex: 1; font-size: 13.5px; color: var(--ink); }
  .search-inline:focus-within { border-color: var(--focus); }
  .fchip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
  .fchip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .fchip select { border: 0; background: none; font-size: 12.5px; color: inherit; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .info-note { font-size: 12.5px; color: var(--ink-soft); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }

  /* My role */
  .person-switch { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .person-switch .lbl { font-size: 12.5px; color: var(--ink-faint); margin-right: 2px; }
  .pchip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); text-decoration: none; }
  .pchip:hover { border-color: var(--line-strong); color: var(--ink); }
  .pchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .pchip.dashed { border-style: dashed; padding-left: 12px; }
  .role-grid { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 22px; align-items: start; }
  .role-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .role-head { display: flex; align-items: center; gap: 14px; }
  .rh-main { flex: 1; min-width: 0; }
  .purpose { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .mini-h { margin: 4px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
  .duties { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; line-height: 1.45; }
  .role-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .rf-val { display: flex; align-items: center; gap: 6px; font-weight: 500; margin-top: 3px; }
  .proc-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .pg-head { display: flex; align-items: baseline; gap: 8px; }
  .pg-head h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .pg-head span { font-size: 12.5px; color: var(--ink-faint); }
  .proc-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
  .proc-row:hover { border-color: var(--line-strong); }
  .pr-main { display: flex; flex-direction: column; min-width: 0; }
  .pr-name { font-weight: 550; }
  .pr-when { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }

  /* Team */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .person-card { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 20px 14px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: center; text-decoration: none; color: var(--ink); }
  .person-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
  .pc-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; margin-top: 4px; }
  .pc-role { font-size: 11.5px; color: var(--ink-faint); min-height: 1em; }
  .pc-stats { display: flex; gap: 6px; margin-top: 2px; }
  .matrix { overflow: hidden; }
  .mx-head { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .mx-head h2 { margin: 0; flex: 1; font-size: 14.5px; font-weight: 600; }
  .legend-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); flex-wrap: wrap; }
  .legend-inline .cell { width: 20px; height: 20px; margin-left: 8px; }
  .cell { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  .cell.o { background: var(--accent); color: var(--accent-ink); }
  .cell.b { background: color-mix(in srgb, var(--focus) 18%, var(--panel)); color: var(--focus); }
  .cell.s { background: var(--amber-bg); color: var(--amber); }
  .cell.d { background: var(--muted-bg); color: var(--ink-soft); }
  .gap-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-left: 8px; vertical-align: middle; }
  .mx-scroll { overflow-x: auto; }
  .mx-scroll table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .mx-scroll th, .mx-scroll td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: center; }
  .mx-scroll thead th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }
  .mx-scroll thead th:first-child { text-align: left; }
  .mx-scroll tbody th { text-align: left; font-weight: 500; white-space: nowrap; }
  .mx-scroll tbody th a { color: var(--ink); text-decoration: none; }
  .mx-scroll tbody th a:hover { text-decoration: underline; }
  .mx-person { display: inline-flex; align-items: center; gap: 6px; }

  /* Process list */
  .table-card { overflow: hidden; }
  .pt-row { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 60px 160px; gap: 12px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13.5px; }
  a.pt-row:hover { background: var(--panel-2); }
  .pt-headrow { border-top: 0; background: var(--panel-2); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
  .pt-group { padding: 12px 18px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); border-top: 1px solid var(--line); }
  .pt-name { font-weight: 550; }
  .pt-owner { display: flex; align-items: center; gap: 8px; }
  .pt-owner > span:last-child { display: flex; flex-direction: column; line-height: 1.25; }
  .pt-row .tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
  .pt-row .badge { justify-self: start; }

  /* Process card on the map drawer */
  .proc-card { display: flex; flex-direction: column; gap: 8px; width: 100%; margin: 0 0 12px; padding: 14px; text-align: left; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--focus) 35%, var(--line)); background: color-mix(in srgb, var(--focus) 6%, var(--panel)); color: var(--ink); font-size: 13px; }
  .proc-card:hover { border-color: var(--focus); }
  .proc-card .pc-k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--focus); display: flex; align-items: center; gap: 6px; }
  .proc-card .pcd-name { font-weight: 600; font-size: 14.5px; }
  .proc-card .pc-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .proc-card .pc-line b { color: var(--ink); font-weight: 600; }
  .proc-card .pc-open { font-weight: 600; color: var(--focus); }
  .proc-card.add { border-style: dashed; background: var(--panel-2); color: var(--ink-soft); font-weight: 600; }
  .proc-card.add span { font-weight: 400; font-size: 12px; color: var(--ink-faint); }
  .proc-card.locked { border: 1px dashed var(--line-strong); background: var(--panel-2); }
  .proc-card.locked .pc-k { color: var(--ink-soft); text-transform: none; letter-spacing: 0; font-size: 13px; }
  .proc-card.locked .btn { align-self: flex-start; }

  /* One process */
  .crumbs { font-size: 12.5px; color: var(--ink-faint); }
  .crumbs a { color: inherit; }
  .proc-head { display: flex; align-items: center; gap: 10px; }
  .hub-title { flex: 1; min-width: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.015em; border: 1px solid transparent; border-radius: 8px; padding: 3px 8px; margin-left: -9px; background: none; outline: none; }
  .hub-title:hover { border-color: var(--line); }
  .hub-title:focus { border-color: var(--focus); background: var(--panel); }
  .proc-meta { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .proc-meta label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }
  .proc-meta label.wide { grid-column: span 6; }
  .proc-meta select, .proc-meta input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; color: var(--ink); min-width: 0; }
  .proc-meta select:focus, .proc-meta input:focus { outline: none; border-color: var(--focus); }
  .flow-pick { display: flex; gap: 8px; }
  .flow-pick select { flex: 1; }
  .proc-desc { width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; margin-left: -9px; background: none; resize: none; font-size: 14px; line-height: 1.5; color: var(--ink); outline: none; }
  .proc-desc:hover { border-color: var(--line); }
  .proc-desc:focus { border-color: var(--focus); background: var(--panel); }
  .visible-to { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .ptabs a { padding: 9px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-size: 13.5px; color: var(--ink-soft); text-decoration: none; }
  .ptabs a:hover { color: var(--ink); }
  .ptabs a.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
  .diagram-wrap { overflow: auto; padding: 0; }
  .diagram { min-height: 120px; padding: 12px 0; }
  .diagram svg { display: block; font-family: var(--font); }
  .lane { fill: var(--panel); } .lane.alt { fill: var(--panel-2); }
  .lane-head { fill: var(--panel-2); stroke: var(--line); }
  .lane-name { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .lane-role { font-size: 11px; fill: var(--ink-faint); }
  .sl-box { fill: var(--panel); stroke-width: 1.2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.06)); }
  .sl-step:hover .sl-box { stroke-width: 2.4; }
  .sl-num { font-size: 10.5px; font-weight: 700; fill: #fff; }
  .sl-kind { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; fill: var(--ink-faint); }
  .sl-text { font-size: 12px; font-weight: 500; fill: var(--ink); }
  .sl-tool { font-size: 10.5px; fill: var(--ink-soft); }
  .sl-arrow { fill: none; stroke: var(--ink-faint); stroke-width: 1.6; }
  .pm-edge { fill: none; stroke: var(--edge-flow); stroke-width: 2.5; }
  .pm-edge.back { stroke-dasharray: 6 5; }
  .pm-stub { stroke: var(--line-strong); stroke-width: 1.6; }
  .pm-node { fill: var(--panel); stroke: var(--line-strong); filter: drop-shadow(0 1px 2px rgba(0,0,0,.06)) drop-shadow(0 4px 10px rgba(0,0,0,.05)); }
  .pm-ini { font-size: 12px; font-weight: 700; fill: #fff; }
  .pm-name { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .pm-pill-bg { fill: var(--panel); stroke: var(--line-strong); }
  .pm-pill:hover .pm-pill-bg { stroke: var(--focus); }
  .pm-text { font-size: 12px; font-weight: 500; fill: var(--ink); }

  .steps-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .steps-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .step-card { display: flex; gap: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 12px; transition: box-shadow .3s; }
  .step-card:focus-within { border-color: var(--focus); border-left-color: var(--c); }
  .step-card.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
  .sc-num { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; }
  .sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .sc-text { width: 100%; border: 0; outline: none; background: none; resize: none; font-size: 14px; font-weight: 500; line-height: 1.45; padding: 3px 0; color: var(--ink); }
  .sc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sc-who { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); }
  .sc-who select { border: 0; background: none; font-size: 12.5px; color: var(--ink); max-width: 150px; }
  .sc-tool { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; background: var(--panel-2); color: var(--ink); }
  .sc-min { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-faint); }
  .sc-min input { width: 54px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; font-size: 12.5px; background: var(--panel-2); color: var(--ink); }
  .sc-ctrl { display: flex; opacity: 0; transition: opacity .15s; }
  .step-card:hover .sc-ctrl, .step-card:focus-within .sc-ctrl { opacity: 1; }
  .sc-ctrl button, .ck button { border: 0; background: none; color: var(--ink-faint); width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }
  .sc-ctrl button:hover, .ck button:hover { background: var(--muted-bg); color: var(--ink); }
  .sc-ctrl button.del:hover { background: var(--danger-bg); color: var(--danger); }
  .sc-ctrl button:disabled { opacity: .3; }
  .checklist { display: flex; flex-direction: column; gap: 4px; }
  .ck { display: flex; align-items: center; gap: 8px; }
  .ck-box { width: 14px; height: 14px; border: 1.5px solid var(--line-strong); border-radius: 4px; flex-shrink: 0; }
  .ck input { flex: 1; border: 0; border-bottom: 1px solid transparent; background: none; font-size: 13px; padding: 3px 0; color: var(--ink); outline: none; }
  .ck input:focus { border-bottom-color: var(--focus); }
  .ck-add { align-self: flex-start; border: 0; background: none; padding: 2px 0; font-size: 12.5px; color: var(--focus); }
  .step-add { display: flex; gap: 8px; flex-wrap: wrap; }
  .steps-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  .side-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .side-card h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .side-person { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .side-person > span:last-child { display: flex; flex-direction: column; }

  /* Settings */
  .access-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
  .people-col { display: flex; flex-direction: column; gap: 10px; }
  .people-list { display: flex; flex-direction: column; gap: 2px; }
  .plist-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
  .plist-row:hover { background: var(--panel); }
  .plist-row.on { background: var(--panel); box-shadow: 0 0 0 1.5px var(--accent); }
  .acc-chip { font-size: 11.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .acc-chip.admin { background: var(--accent); color: var(--accent-ink); }
  .acc-chip.finance { background: color-mix(in srgb, var(--focus) 16%, var(--panel)); color: var(--focus); }
  .acc-chip.custom { background: var(--amber-bg); color: var(--amber); }
  .acc-chip.map { background: var(--muted-bg); color: var(--ink-soft); }
  .acc-editor { display: flex; flex-direction: column; gap: 14px; }
  .acc-head { display: flex; align-items: center; gap: 14px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .toggle input, .acc-row input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .preset-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acc-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .acc-card { overflow: hidden; }
  .acc-card h3 { margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 600; }
  .acc-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .acc-row:last-child { border-bottom: 0; }
  .acc-row.muted { color: var(--ink-faint); }
  .acc-row.sub { padding: 6px 16px 6px 44px; font-size: 13px; color: var(--ink-soft); border-bottom: 0; }
  .acc-fn { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .acc-fn:last-child { border-bottom: 0; }
  .acc-fn .acc-row:first-child { border-bottom: 0; }
  .acc-foot { display: flex; align-items: center; gap: 14px; padding: 12px 16px; font-size: 13px; flex-wrap: wrap; }
  .acc-foot .grow { display: block; }
  .acc-foot select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 13px; color: var(--ink); margin-left: 6px; }
  .fn-settings, .general-settings { padding: 18px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
  .fn-row { display: flex; align-items: center; gap: 10px; }
  .fn-row input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; }
  .fn-row input[data-ffield="name"] { flex: 1; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 13.5px; color: var(--ink); }
  .general-settings .acc-row { padding: 9px 0; border: 0; }

  /* Hub dialogs */
  dialog:has(form.wide) { width: min(560px, calc(100vw - 32px)); }
  .share-list { display: flex; flex-direction: column; max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .share-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .share-row:last-child { border-bottom: 0; }
  .share-row input { width: 16px; height: 16px; accent-color: var(--accent); }
  .live-status { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
  .live-status dt { color: var(--ink-faint); }
  .live-status dd { margin: 0; overflow-wrap: anywhere; }
  .hp-me { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .hp-me > span:last-child { display: flex; flex-direction: column; }
  .home-opts { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }
  .home-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; cursor: pointer; }
  .home-opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--panel-2); }
  .home-opt input { accent-color: var(--accent); }

  @media (max-width: 1000px) {
    .role-grid, .steps-grid, .access-grid, .acc-cols { grid-template-columns: minmax(0, 1fr); }
    .steps-side { position: static; }
    .proc-meta { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .proc-meta label.wide { grid-column: span 3; }
    .pt-row { grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 110px; }
    .pt-row > :nth-child(4), .pt-row > :nth-child(5) { display: none; }
  }
  @media (max-width: 760px) {
    .tabs { order: 4; flex-basis: 100%; margin: 0; overflow-x: auto; }
    .hub-page { padding: 16px 14px 48px; }
    .proc-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .proc-meta label.wide { grid-column: span 2; }
    .proc-head { flex-wrap: wrap; }
    .hub-title { flex-basis: 100%; font-size: 21px; }
    .pt-row { grid-template-columns: minmax(0, 1fr) 110px; }
    .pt-row > :nth-child(2), .pt-row > :nth-child(3) { display: none; }
    .proc-row { grid-template-columns: 14px minmax(0, 1fr); }
    .proc-row .pr-when, .proc-row .badge { display: none; }
    .search-inline { min-width: 0; flex: 1; }
  }

  /* ---------- Live presence ---------- */
  .peers { display: flex; align-items: center; padding-left: 4px; }
  .peer {
    position: relative; width: 28px; height: 28px; margin-left: -5px; padding: 0; overflow: hidden;
    border-radius: 50%; border: 2px solid var(--panel); background: var(--pc); color: #fff;
    font-size: 10.5px; font-weight: 700; display: grid; place-items: center;
    transition: transform .15s, opacity .3s;
  }
  .peer:hover { transform: translateY(-2px); z-index: 1; }
  .peer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .peer.away { opacity: .45; }
  .peer.more { background: var(--muted-bg); color: var(--ink-soft); cursor: default; }
  .peer.more:hover { transform: none; }

  .cursors { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  .cursor { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .3s; }
  .cursor svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .cursor span {
    position: absolute; left: 13px; top: 17px; white-space: nowrap;
    background: var(--pc); color: #fff; font-size: 11.5px; font-weight: 600;
    padding: 2px 7px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .cursor.hide { opacity: 0; }

  .peer-ring { fill: none; stroke-width: 2.5; pointer-events: none; }
  .peer-tag { pointer-events: none; }
  .peer-tag text { fill: #fff; font-size: 11px; font-weight: 600; }

  .here { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .here-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 2px 10px 2px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--pc) 14%, transparent); color: var(--ink);
  }
  .here-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
  .tl-step.peer-editing .tl-card { box-shadow: 0 0 0 2px var(--peer); }
  .tl-peer { display: block; font-size: 11px; font-weight: 600; color: var(--peer); margin-bottom: 2px; }
  .tl-peer:empty { display: none; }

  .node.remote-flash .node-card { animation: rflash 1.8s ease-out; }
  .edge.remote-flash .edge-line { animation: rflash-line 1.8s ease-out; }
  .edge-label.remote-flash .pill { animation: rflash 1.8s ease-out; }
  @keyframes rflash { 0%, 30% { stroke: var(--focus); stroke-width: 4; } }
  @keyframes rflash-line { 0%, 30% { stroke-width: 6; } }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .node:focus-visible { outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .edge-pulse { display: none; }
    .timeline::before { animation: none; }
    .drawer, .zoombar { transition: none; }
    .node.remote-flash .node-card, .edge.remote-flash .edge-line, .edge-label.remote-flash .pill { animation: none; }
  }

  @media (max-width: 760px) {
    .topbar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .search { order: 3; max-width: none; flex-basis: 100%; }
    .search kbd { display: none; }
    .actions .btn .lbl { display: none; }
    .user .u-name { display: none; }
    .hint { display: none; }
    .drawer {
      top: auto; left: 0; width: auto; height: 68%;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
      transform: translateY(105%);
    }
    .stage.drawer-open .zoombar { right: 16px; bottom: calc(68% + 12px); }
    .dr-scroll { padding: 14px 16px 20px; }
    .dr-foot { padding: 10px 16px; }
    .legend { bottom: 16px; max-width: 200px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 6c5 0 6 6 9 6M7.5 18c5 0 6-6 9-6"/></svg>
      </div>
      <div>
        <h1>Finance</h1>
        <div class="save-state" id="saveState"><span class="dot"></span><span class="txt">Loading…</span></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="search map-only">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search" type="search" placeholder="Search systems, flows, steps" autocomplete="off" aria-label="Search">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
    <div class="actions">
      <button class="btn map-only" id="addSystemBtn" title="Add a system"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">System</span></button>
      <button class="btn primary map-only" id="addFlowBtn" title="Add a connection between two systems"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h13M13 6l6 6-6 6"/></svg><span class="lbl">Connection</span></button>
      <button class="icon-btn map-only" id="menuBtn" aria-label="More" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      <div class="peers" id="peers" hidden aria-label="Who else is here"></div>
      <button type="button" class="user" id="user" hidden title="You · choose your home screen"><img id="avatar" alt="" hidden><span class="u-name" id="userName"></span></button>
    </div>
    <div class="menu" id="menu" hidden role="menu">
      <button data-menu="fit" role="menuitem">Fit everything in view<span class="m-sub">Shortcut: F</span></button>
      <button data-menu="tidy" role="menuitem">Tidy layout<span class="m-sub">Arrange systems left → right by data flow</span></button>
      <button data-menu="export" role="menuitem">Export as JSON<span class="m-sub">Download a backup of the whole map</span></button>
      <button data-menu="refresh" role="menuitem">Refresh<span class="m-sub">Pull in edits from teammates</span></button>
      <button data-menu="live" role="menuitem">Live connection status<span class="m-sub">Who the app can see right now</span></button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <main class="stage" id="stage">
    <svg id="canvas" data-zoom="mid" aria-label="Map of finance systems and data flows">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="var(--grid)"/>
        </pattern>
        <marker id="m-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" class="mk-flow"/>
        </marker>
        <marker id="m-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" class="mk-sync"/>
        </marker>
        <marker id="m-rec" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse">
          <circle cx="6" cy="6" r="4" class="mk-rec"/>
        </marker>
      </defs>
      <rect id="gridRect" width="100%" height="100%" fill="url(#grid)"/>
      <g id="viewport">
        <g id="edges"></g>
        <g id="labels"></g>
        <g id="nodes"></g>
        <g id="peerMarks"></g>
        <path id="ghost" class="ghost" hidden/>
      </g>
    </svg>

    <div class="cursors" id="cursors" aria-hidden="true"></div>

    <div class="hint" id="hint" hidden>
      <span><b>Scroll</b> to zoom · <b>drag</b> to pan · <b>double-click</b> to add a system · drag a system's <b>●</b> to connect it</span>
      <button id="hintClose" aria-label="Dismiss tip">✕</button>
    </div>

    <div class="method-bar" id="methodBar" role="group" aria-label="How data moves — filter"></div>

    <details class="legend" id="legend">
      <summary>Legend</summary>
      <div class="legend-body" id="legendBody"></div>
    </details>

    <div class="zoombar">
      <button class="icon-btn" id="zoomOut" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <output id="zoomPct">100%</output>
      <button class="icon-btn" id="zoomIn" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="zoomFit" aria-label="Fit everything" title="Fit everything (F)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
    </div>

    <div class="empty-state" id="empty">
      <div class="loading" id="loading">Loading the map…</div>
      <div class="empty-card" id="emptyCard" hidden>
        <h2>Map your first system</h2>
        <p>Add the software your finance data lives in, then connect systems to document how data moves between them.</p>
        <button class="btn primary" id="emptyAdd">Add a system</button>
      </div>
    </div>

    <div class="hub-view" id="hubView" hidden></div>

    <aside class="drawer" id="drawer" aria-label="Details">
      <div class="dr-scroll" id="drScroll"></div>
      <div class="dr-foot" id="drFoot"></div>
    </aside>
  </main>

  <dialog id="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
